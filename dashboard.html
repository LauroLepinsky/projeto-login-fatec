<!doctype html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Dashboard</title>
		<link rel="stylesheet" href="style.css" />
		<style>
			.dashboard-container {
				background-color: #1f1f1f;
				padding: 30px;
				border-radius: 10px;
				box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
				width: 500px;
				max-width: 90%;
			}

			.menu {
				display: flex;
				gap: 10px;
				margin-bottom: 20px;
				padding: 0;
				list-style: none;
			}

			.menu a {
				display: block;
				padding: 8px 14px;
				background-color: #2c2c2c;
				color: #fff;
				text-decoration: none;
				border-radius: 5px;
			}

			.menu a:hover {
				background-color: #03dac6;
				color: #000;
			}

			#boasVindas {
				color: #03dac6;
			}
		</style>
	</head>
	<body>
		<div class="dashboard-container">
			<nav>
				<ul class="menu">
					<li><a href="dashboard.html">Início</a></li>
					<li><a href="cadastro.html">Cadastrar usuário</a></li>
					<li><a href="index.html">Sair</a></li>
				</ul>
			</nav>

			<h1 id="boasVindas">Bem-vindo!</h1>
			<p>Você está no painel principal do sistema.</p>
		</div>

		<script>
			const params = new URLSearchParams(window.location.search);
			const nome = params.get("usuario");

			if (nome) {
				document.getElementById("boasVindas").textContent =
					"Bem-vindo, " + nome + "!";
			}
		</script>
	</body>
</html>
